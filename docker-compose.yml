services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    # No "ports:" on purpose: the backend reaches the database over the compose network, and
    # publishing 5432 would clash with any PostgreSQL already running on the host.
    # For local development, docker-compose.override.yml (git-ignored) publishes it on 5433.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" is the database service's name on the compose network.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=admission;Password=admission"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # The address the BROWSER uses to reach the backend (published on the host), not a Docker-internal name.
      API_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
