server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The app uses hash routing (#/classes ...), so one page serves everything.
  location / {
    try_files $uri /index.html;
  }

  # Never cache the page or the runtime config, so a new API_URL or a new build is picked up at once.
  # (The hashed files under /assets are safe to cache: their names change with their content.)
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /config.js  { add_header Cache-Control "no-store"; }
}
